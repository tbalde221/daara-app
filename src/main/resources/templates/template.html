<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - Daara-App">
        Daara-App
    </title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">

    <!-- Design system Daara-App -->
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- Bootstrap JavaScript -->
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
    </script>

</head>


<body class="d-flex flex-column min-vh-100">


    <!-- ========================================================= -->
    <!-- NAVBAR -->
    <!-- ========================================================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        <div class="container-fluid px-4">

            <!-- Logo / Nom application -->
            <a class="navbar-brand fw-bold" th:href="@{/}">

                <i class="bi bi-mortarboard-fill me-1"></i>
                <span class="text-info">Daara</span>-App

            </a>


            <!-- Bouton mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Afficher le menu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Menu -->
            <div class="collapse navbar-collapse" id="mainNavbar">


                <!-- Menu principal -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <!-- Accueil -->
                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/}">

                            <i class="bi bi-house-door me-1"></i>
                            Accueil

                        </a>

                    </li>


                    <!-- Gestion -->
                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle" href="#" id="gestionDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">

                            <i class="bi bi-grid me-1"></i>
                            Gestion

                        </a>

                        <ul class="dropdown-menu" aria-labelledby="gestionDropdown">

                            <li>
                                <a class="dropdown-item" th:href="@{/listMaitre}">
                                    <i class="bi bi-person-badge me-2"></i>
                                    Maîtres
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" th:href="@{/listTalibe}">
                                    <i class="bi bi-people me-2"></i>
                                    Talibés
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" th:href="@{/listClasse}">
                                    <i class="bi bi-easel me-2"></i>
                                    Classes
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" th:href="@{/listProgression}">
                                    <i class="bi bi-graph-up-arrow me-2"></i>
                                    Progressions
                                </a>
                            </li>

                        </ul>

                    </li>

                </ul>


                <!-- Utilisateur -->
                <ul class="navbar-nav">

                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">

                            <i class="bi bi-person-circle me-1"></i>
                            Administrateur

                        </a>


                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">


                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-person me-2"></i>
                                    Mon profil
                                </a>
                            </li>


                            <li>
                                <hr class="dropdown-divider">
                            </li>


                            <li>
                                <a class="dropdown-item text-danger" href="#">
                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Déconnexion
                                </a>
                            </li>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- ========================================================= -->
    <!-- CONTENU DES PAGES -->
    <!-- ========================================================= -->

    <main class="flex-grow-1">

        <div layout:fragment="content1">

        </div>

    </main>



    <!-- ========================================================= -->
    <!-- FOOTER COMPACT -->
    <!-- ========================================================= -->

    <footer class="bg-dark text-white mt-4">

        <div class="container py-3">

            <div class="row align-items-center">

                <!-- Logo -->
                <div class="col-md-4 text-center text-md-start">

                    <span class="fw-bold">
                        <span class="text-info">Daara</span>-App
                    </span>

                </div>


                <!-- Description -->
                <div class="col-md-4 text-center">

                    <small class="text-white-50">
                        Gestion et suivi d'un Daara
                    </small>

                </div>


                <!-- Copyright -->
                <div class="col-md-4 text-center text-md-end">

                    <small class="text-white-50">
                        © 2026 Daara-App
                    </small>

                </div>

            </div>

        </div>

    </footer>


    <!-- ========================================================= -->
    <!-- LIEN ACTIF DE LA NAVBAR — détection côté client uniquement -->
    <!-- (aucune donnée serveur requise, ne peut pas casser le rendu) -->
    <!-- ========================================================= -->

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var currentPath = window.location.pathname;

            document.querySelectorAll('.navbar-nav .nav-link, .navbar-nav .dropdown-item')
                .forEach(function (link) {
                    var href = link.getAttribute('href');
                    if (!href || href === '#') return;

                    var isMatch = (href === '/') ? (currentPath === '/') : currentPath.indexOf(href) === 0;

                    if (isMatch) {
                        link.classList.add('active');

                        var parentDropdown = link.closest('.dropdown');
                        if (parentDropdown) {
                            var toggle = parentDropdown.querySelector(':scope > .dropdown-toggle');
                            if (toggle) toggle.classList.add('active');
                        }
                    }
                });
        });
    </script>


</body>

</html>
