<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{template}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maitres</title>

</head>

<body>
    <div layout:fragment="content1">
        <div class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <div class="card shadow-sm border-0 app-form-card">

                        <!-- En-tête -->
                        <div class="card-header bg-primary text-white text-center py-3">
                            <h4 class="mb-0">
                                <i class="bi bi-person-plus me-2"></i>
                                Ajouter un maitre
                            </h4>
                        </div>

                        <!-- Formulaire -->
                        <div class="card-body p-4">

                            <form th:action="@{/saveMaitre}" method="post">

                                <!-- ID (technique, non éditable) -->
                                <input type="hidden" id="idMaitre" name="idMaitre" th:value="${maitre.idMaitre}">

                                <!-- Prénom -->
                                <div class="mb-3">
                                    <label for="prenom" class="form-label fw-semibold required">
                                        Prénom
                                    </label>

                                    <input type="text" id="prenom" name="prenom" class="form-control"
                                        placeholder="Entrez le prénom" th:value="${maitre.prenom}">

                                    <span class="text-danger small invalid-feedback d-block"
                                        th:errors="${maitre.prenom}"></span>
                                </div>

                                <!-- Nom -->
                                <div class="mb-3">
                                    <label for="nom" class="form-label fw-semibold required">
                                        Nom
                                    </label>

                                    <input type="text" id="nom" name="nom" class="form-control"
                                        placeholder="Entrez le nom" th:value="${maitre.nom}">

                                    <span class="text-danger small invalid-feedback d-block"
                                        th:errors="${maitre.nom}"></span>
                                </div>

                                <!-- Téléphone -->
                                <div class="mb-4">
                                    <label for="telephone" class="form-label fw-semibold">
                                        Téléphone
                                    </label>

                                    <input type="text" id="telephone" name="telephone" class="form-control"
                                        placeholder="Entrez le numéro de téléphone" th:value="${maitre.telephone}">

                                    <span class="text-danger small invalid-feedback d-block"
                                        th:errors="${maitre.telephone}"></span>
                                </div>

                                <!-- Boutons -->
                                <div class="d-flex justify-content-between">

                                    <a th:href="@{/listMaitre}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle me-1"></i>
                                        Annuler
                                    </a>

                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-save me-1"></i>
                                        Enregistrer
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>


    </div>
</body>

</html>
